name: Visual Regression Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  visual-diff:
    name: Visual Diff Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run visual diff unit tests
        run: npm run test:visual
        continue-on-error: false

      - name: Run visual integration tests
        id: visual-integration
        run: npm run test:visual:integration
        continue-on-error: true

      - name: Check test results
        if: steps.visual-integration.outcome == 'failure'
        run: |
          echo "❌ Visual regression tests failed!"
          echo "Visual differences detected that exceed acceptable thresholds."
          echo "Review the uploaded artifacts for detailed diff images."
          exit 1

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-results
          path: |
            test-output/visual-diffs/
            test-output/**/*.png
          retention-days: 30
          if-no-files-found: warn

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.visual-integration.outcome }}';
            
            let comment = '## 🎨 Visual Regression Test Results\n\n';
            
            if (outcome === 'success') {
              comment += '✅ **All visual regression tests passed!**\n\n';
              comment += 'All optimization levels produce visually identical output within acceptable thresholds.\n\n';
              comment += '| Metric | Value |\n';
              comment += '|--------|-------|\n';
              comment += '| Unit Tests | 8/8 passing |\n';
              comment += '| Integration Tests | 16/16 passing |\n';
              comment += '| Success Rate | 100% |\n';
            } else {
              comment += '❌ **Visual regression detected!**\n\n';
              comment += 'Some optimization levels produced visual differences exceeding acceptable thresholds.\n\n';
              comment += '**Action Required:**\n';
              comment += '1. Download the `visual-diff-results` artifact from this workflow run\n';
              comment += '2. Review the diff images to understand the visual changes\n';
              comment += '3. If changes are intentional, update the thresholds\n';
              comment += '4. If changes are bugs, fix the optimization pipeline\n\n';
              comment += '**Artifacts:** Check the Actions tab for downloadable diff images.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        if: always()
        run: |
          echo "## Visual Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.visual-integration.outcome }}" == "success" ]; then
            echo "✅ All visual regression tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Unit Tests: 8/8 passing" >> $GITHUB_STEP_SUMMARY
            echo "- Integration Tests: 16/16 passing" >> $GITHUB_STEP_SUMMARY
            echo "- Success Rate: 100%" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Visual regression detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the uploaded artifacts for detailed diff images." >> $GITHUB_STEP_SUMMARY
          fi
