name: Windows Recovery Authorization POC Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - fix/directive-046-dependency-security

permissions:
  contents: read

jobs:
  windows-poc:
    name: Isolated Win32 POC (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce remediation-branch scope
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/fix/directive-046-dependency-security') {
            throw "This qualification is limited to the remediation branch; got $env:GITHUB_REF"
          }
          "Qualified revision: $(git rev-parse HEAD)"

      - name: Create evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\svger-windows-recovery-evidence" -Force | Out-Null

      - name: Create and verify protected disposable test parent
        id: secure_temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $currentSid = $identity.User
          $systemSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18')
          $secureTemp = Join-Path $env:RUNNER_TEMP ("svger-poc-private-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $secureTemp | Out-Null
          try {
            $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($currentSid)
            $acl.SetAccessRuleProtection($true, $false)
            $inheritance = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
              [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
            $allow = [System.Security.AccessControl.AccessControlType]::Allow
            $fullControl = [System.Security.AccessControl.FileSystemRights]::FullControl
            [void]$acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
              $currentSid, $fullControl, $inheritance,
              [System.Security.AccessControl.PropagationFlags]::None, $allow))
            [void]$acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
              $systemSid, $fullControl, $inheritance,
              [System.Security.AccessControl.PropagationFlags]::None, $allow))
            Set-Acl -LiteralPath $secureTemp -AclObject $acl

            $verified = Get-Acl -LiteralPath $secureTemp
            $actualOwnerSid = $verified.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            if ($actualOwnerSid -ne $currentSid.Value) { throw "Private test parent owner mismatch: $actualOwnerSid" }
            if (-not $verified.AreAccessRulesProtected) { throw 'Private test parent DACL is not protected.' }
            $rules = $verified.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])
            $allowedSids = @($currentSid.Value, $systemSid.Value)
            if ($rules.Count -ne 2) { throw "Private test parent has $($rules.Count) ACEs; expected exactly two." }
            foreach ($rule in $rules) {
              if ($rule.AccessControlType -ne $allow -or $rule.IdentityReference.Value -notin $allowedSids) {
                throw "Unexpected ACE on private test parent: $($rule.AccessControlType) for $($rule.IdentityReference.Value)"
              }
            }
            foreach ($sid in $allowedSids) {
              if (-not ($rules | Where-Object { $_.IdentityReference.Value -eq $sid -and $_.AccessControlType -eq $allow -and ($_.FileSystemRights -band $fullControl) -eq $fullControl })) {
                throw "Private test parent is missing full-control allow ACE for $sid."
              }
            }
            if ((Get-Item -LiteralPath $secureTemp).Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
              throw 'Private test parent is a reparse point.'
            }
            "TEMP=$secureTemp" | Add-Content -LiteralPath $env:GITHUB_ENV
            "TMP=$secureTemp" | Add-Content -LiteralPath $env:GITHUB_ENV
            "SVGER_POC_SECURE_TEMP=$secureTemp" | Add-Content -LiteralPath $env:GITHUB_ENV
            Write-Host 'PASS private disposable parent: current-user owner; protected DACL; only current user and SYSTEM allow ACEs'
          } catch {
            Remove-Item -LiteralPath $secureTemp -Recurse -Force -ErrorAction SilentlyContinue
            throw
          }

      - name: Configure with MSVC and CMake
        id: configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP\svger-windows-recovery-evidence"
          cmake -S experiments/windows-recovery-authorization -B "$env:RUNNER_TEMP\svger-windows-recovery-build" -A x64 2>&1 | Tee-Object -FilePath "$evidence\configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build isolated harness
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP\svger-windows-recovery-evidence"
          cmake --build "$env:RUNNER_TEMP\svger-windows-recovery-build" --config Release --parallel 2 2>&1 | Tee-Object -FilePath "$evidence\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run disposable-directory self-test
        id: self_test
        if: steps.secure_temp.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP\svger-windows-recovery-evidence"
          $exe = "$env:RUNNER_TEMP\svger-windows-recovery-build\Release\svger-recovery-poc.exe"
          & $exe self-test 2>&1 | Tee-Object -FilePath "$evidence\self-test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run ACL, owner, reparse-point, and cross-process qualification
        id: qualify
        if: ${{ always() && steps.build.outcome == 'success' && steps.secure_temp.outcome == 'success' }}
        shell: pwsh
        run: |
          $evidence = "$env:RUNNER_TEMP\svger-windows-recovery-evidence"
          $exe = "$env:RUNNER_TEMP\svger-windows-recovery-build\Release\svger-recovery-poc.exe"
          & "$env:GITHUB_WORKSPACE\experiments\windows-recovery-authorization\qualify.ps1" -Exe $exe -ReportPath "$evidence\qualification.json" 2>&1 | Tee-Object -FilePath "$evidence\qualification.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize qualification boundaries
        if: always()
        shell: pwsh
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SECURE_TEMP_OUTCOME: ${{ steps.secure_temp.outcome }}
          SELF_TEST_OUTCOME: ${{ steps.self_test.outcome }}
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $summary -Value '# Isolated Windows recovery POC qualification'
          Add-Content -LiteralPath $summary -Value ''
          Add-Content -LiteralPath $summary -Value "- Revision: ``$(git rev-parse HEAD)``"
          Add-Content -LiteralPath $summary -Value "- MSVC/CMake configure: **$env:CONFIGURE_OUTCOME**"
          Add-Content -LiteralPath $summary -Value "- C++ build: **$env:BUILD_OUTCOME**"
          Add-Content -LiteralPath $summary -Value "- Protected disposable parent: **$env:SECURE_TEMP_OUTCOME**"
          Add-Content -LiteralPath $summary -Value "- Disposable self-test: **$env:SELF_TEST_OUTCOME**"
          Add-Content -LiteralPath $summary -Value '- Production integration: NOT PERFORMED'
          Add-Content -LiteralPath $summary -Value '- Node.js 22/24 integration: UNTESTED (no Node integration exists)'
          Add-Content -LiteralPath $summary -Value '- Experimental executable: not included in uploaded evidence'
          $report = "$env:RUNNER_TEMP\svger-windows-recovery-evidence\qualification.json"
          if (Test-Path -LiteralPath $report) {
            $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          } else {
            $data = [pscustomobject]@{
              schemaVersion = 1
              generatedAtUtc = [DateTime]::UtcNow.ToString('o')
              nodeIntegration = 'UNTESTED: no Node integration exists'
              results = @()
            }
          }
          foreach ($gate in @(
            @{ name = 'MSVC/CMake configure'; outcome = $env:CONFIGURE_OUTCOME },
            @{ name = 'C++ build'; outcome = $env:BUILD_OUTCOME },
            @{ name = 'Protected disposable test parent'; outcome = $env:SECURE_TEMP_OUTCOME },
            @{ name = 'Disposable self-test'; outcome = $env:SELF_TEST_OUTCOME }
          )) {
            if ($gate.outcome -eq 'success') { $status = 'PASS' }
            elseif ($gate.outcome -eq 'failure') { $status = 'FAIL' }
            else { $status = 'NOT_RUN' }
            $data.results += [pscustomobject]@{
              gate = $gate.name
              status = $status
              evidence = "GitHub Actions step outcome: $($gate.outcome)"
            }
          }
          $tempCleanupStatus = 'NOT_RUN'
          $tempCleanupEvidence = 'protected disposable parent was not created'
          if ($env:SVGER_POC_SECURE_TEMP -and (Test-Path -LiteralPath $env:SVGER_POC_SECURE_TEMP)) {
            Remove-Item -LiteralPath $env:SVGER_POC_SECURE_TEMP -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $env:SVGER_POC_SECURE_TEMP) {
              $tempCleanupStatus = 'FAIL'
              $tempCleanupEvidence = 'protected disposable parent remains after cleanup attempt'
            } else {
              $tempCleanupStatus = 'PASS'
              $tempCleanupEvidence = 'protected disposable parent and contents removed'
            }
          } elseif ($env:SVGER_POC_SECURE_TEMP) {
            $tempCleanupStatus = 'PASS'
            $tempCleanupEvidence = 'protected disposable parent already absent'
          }
          $data.results += [pscustomobject]@{
            gate = 'Protected parent cleanup'
            status = $tempCleanupStatus
            evidence = $tempCleanupEvidence
          }
          $data | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $report -Encoding UTF8
          Add-Content -LiteralPath $summary -Value ''
          Add-Content -LiteralPath $summary -Value '| Gate | Result | Evidence |'
          Add-Content -LiteralPath $summary -Value '| --- | --- | --- |'
          foreach ($result in $data.results) {
            $evidence = ([string]$result.evidence).Replace('|', '\|').Replace("`r", ' ').Replace("`n", ' ')
            Add-Content -LiteralPath $summary -Value "| $($result.gate) | **$($result.status)** | $evidence |"
          }
          if ($data.results.status -contains 'INCONCLUSIVE') {
            Add-Content -LiteralPath $summary -Value ''
            Add-Content -LiteralPath $summary -Value '> Owner-mismatch security gate is inconclusive on this runner. The workflow is not a full qualification pass; use a suitable isolated Windows runner with the required privilege.'
            exit 1
          }
          if ($data.results.status -contains 'FAIL' -or $data.results.status -contains 'NOT_RUN') { exit 1 }

      - name: Preserve text qualification evidence (no binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-recovery-poc-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\svger-windows-recovery-evidence\
          if-no-files-found: warn
          retention-days: 14
