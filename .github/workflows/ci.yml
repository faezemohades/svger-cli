name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test:
    name: ${{ matrix.suite }} - ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 22.x, suite: Full, command: validate:phase1 }
          - { os: windows-latest, node-version: 22.x, suite: Platform, command: test:phase1:platform }
          - { os: macos-latest, node-version: 22.x, suite: Platform, command: test:phase1:platform }
          - { os: ubuntu-latest, node-version: 24.x, suite: Full, command: validate:phase1 }
          - { os: windows-latest, node-version: 24.x, suite: Full, command: validate:phase1 }
          - { os: macos-latest, node-version: 24.x, suite: Full, command: validate:phase1 }
          - { os: ubuntu-latest, node-version: 26.x, suite: Current-smoke, command: test:phase1:smoke }
          - { os: windows-latest, node-version: 26.x, suite: Current-smoke, command: test:phase1:smoke }
          - { os: macos-latest, node-version: 26.x, suite: Current-smoke, command: test:phase1:smoke }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce immutable baseline policy
        run: npm run baseline:policy
        env:
          BASELINE_UPDATE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'baseline-update-approved') }}

      - name: Run ${{ matrix.suite }} Phase 1 gate
        run: npm run ${{ matrix.command }}

      - name: Run coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' && matrix.suite == 'Full'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' && matrix.suite == 'Full'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/
          fail_ci_if_error: false

  legacy-node-compatibility:
    name: Legacy compatibility - Ubuntu / Node.js 18.17.0 (EOL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup legacy Node.js 18.17.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.17.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility smoke
        run: npm run test:phase1:smoke

  typescript-compatibility:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: [5.6.3, 5.9.3, 7.0.2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install TypeScript ${{ matrix.typescript }}
        run: npm install --no-save --package-lock=false typescript@${{ matrix.typescript }}

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Generate documentation
        run: npm run docs:generate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: dist/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-files
          path: dist/

      - name: Run integration tests
        run: npm run test:integration

      - name: Test CLI installation
        run: |
          npm pack
          npm install -g svger-cli-*.tgz
          svger-cli --version
          svger-cli --help

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test, build, integration-test, security]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
