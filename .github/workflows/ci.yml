name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} - ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 22.x, suite: Full, command: quality:full }
          - { os: windows-latest, node-version: 22.x, suite: Platform, command: test:phase1:platform }
          - { os: macos-latest, node-version: 22.x, suite: Platform, command: test:phase1:platform }
          - { os: ubuntu-latest, node-version: 24.x, suite: Full, command: quality:full }
          - { os: windows-latest, node-version: 24.x, suite: Platform, command: test:phase1:platform }
          - { os: macos-latest, node-version: 24.x, suite: Platform, command: test:phase1:platform }
          - { os: ubuntu-latest, node-version: 26.x, suite: Current-smoke, command: quality:fast }
          - { os: windows-latest, node-version: 26.x, suite: Current-smoke, command: quality:fast }
          - { os: macos-latest, node-version: 26.x, suite: Current-smoke, command: quality:fast }

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce immutable baseline policy
        run: npm run baseline:policy
        env:
          BASELINE_UPDATE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'baseline-update-approved') }}

      - name: Run ${{ matrix.suite }} Phase 1 gate
        run: npm run ${{ matrix.command }}

      - name: Run coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' && matrix.suite == 'Full'
        run: npm run test:coverage

  legacy-node-compatibility:
    name: Legacy compatibility - Ubuntu / Node.js 18.17.0 (EOL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup legacy Node.js 18.17.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18.17.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility smoke
        run: npm run test:phase1:smoke

  typescript-compatibility:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: [5.6.3, 5.9.3, 7.0.2]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install TypeScript ${{ matrix.typescript }}
        run: npm install --no-save --package-lock=false typescript@${{ matrix.typescript }}

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Generate documentation
        run: npm run docs:generate

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-files
          path: dist/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: dist-files
          path: dist/

      - name: Run integration tests
        run: npm run test:integration

      - name: Test CLI installation
        run: |
          npm pack
          npm install -g svger-cli-*.tgz
          svger-cli --version
          svger-cli --help

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
